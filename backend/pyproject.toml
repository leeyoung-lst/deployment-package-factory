[project]
name = "deployment-package-factory"
version = "0.1.0"
description = "Standalone deployment package export service."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deployment_package_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]
