services:
  deployment-package-factory-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8096:8096"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 6

  deployment-package-factory-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      deployment-package-factory-backend:
        condition: service_healthy
    ports:
      - "5186:80"
