services:
  deployment-package-factory-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8096:8096"
    environment:
      DEPLOYMENT_PACKAGE_DATA_DIR: /app/data
      DEPLOYMENT_PACKAGE_TASK_DB: /app/data/deployment-package-tasks.sqlite3
      DEPLOYMENT_PACKAGE_OUTPUT_DIR: /app/data/deployment-packages
      DEPLOYMENT_PACKAGE_MAX_CONCURRENT_BUILDS: "1"
      DEPLOYMENT_PACKAGE_RETENTION_DAYS: "30"
      DEPLOYMENT_PACKAGE_MAX_TOTAL_GB: "500"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 6

  deployment-package-factory-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      deployment-package-factory-backend:
        condition: service_healthy
    ports:
      - "5186:80"
