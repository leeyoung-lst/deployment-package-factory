databaseOptions:
  dm:
    name: 达梦 DM
    domestic: true
    image: 192.168.10.210/local-ai/dm8-dev:dm8_20241022_rev244896_x86_rh6_64
    initPath: init/dm
    port: 5236
    dataPath: /opt/dmdbms/data
    envTemplate:
      DM_USERNAME: SYSDBA
      DM_PASSWORD: __REPLACE_WITH_DM_PASSWORD__
    envSources:
      DM_PASSWORD:
        env: DM_PASSWORD
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - dm
          - dm-secret
          - database-secret
        secretKeys:
          - DM_PASSWORD
    composeEnvironment:
      DM_USERNAME: ${DM_USERNAME}
      DM_PASSWORD: ${DM_PASSWORD}
    composeHealthcheck:
      test:
        - CMD-SHELL
        - bash -lc '</dev/tcp/127.0.0.1/5236'
      interval: 20s
      timeout: 5s
      retries: 30
      startPeriod: 120s
  postgres:
    name: PostgreSQL
    domestic: false
    image: 192.168.10.210/local-ai/postgres:16-alpine
    initPath: init/postgres
    port: 5432
    dataPath: /var/lib/postgresql/data
    envTemplate:
      DATABASE_USER: local_ai
      DATABASE_NAME: local_ai
      DATABASE_PASSWORD: __REPLACE_WITH_DATABASE_PASSWORD__
    envSources:
      DATABASE_PASSWORD:
        env: DATABASE_PASSWORD
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - postgres
          - postgresql
          - postgres-secret
          - postgresql-secret
          - database-secret
        secretKeys:
          - DATABASE_PASSWORD
          - POSTGRES_PASSWORD
    composeEnvironment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    composeHealthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 20s
      timeout: 5s
      retries: 10
      startPeriod: 20s
middleware:
  redis:
    name: Redis
    image: 192.168.10.210/local-ai/redis:7.4-alpine
    port: 6379
    dataPath: /data
    envTemplate:
      REDIS_PASSWORD: __REPLACE_WITH_REDIS_PASSWORD__
    envSources:
      REDIS_PASSWORD:
        env: REDIS_PASSWORD
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - redis
          - redis-secret
        secretKeys:
          - REDIS_PASSWORD
    composeEnvironment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    composeCommand:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    composeHealthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" ping
      interval: 20s
      timeout: 5s
      retries: 10
      startPeriod: 10s
  minio:
    name: MinIO
    image: 192.168.10.210/local-ai/minio/minio:RELEASE.2025-09-07T16-13-09Z
    port: 9000
    dataPath: /data
    envTemplate:
      MINIO_ROOT_USER: local-ai
      MINIO_ROOT_PASSWORD: __REPLACE_WITH_MINIO_ROOT_PASSWORD__
    envSources:
      MINIO_ROOT_PASSWORD:
        env: MINIO_ROOT_PASSWORD
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - minio
          - minio-secret
        secretKeys:
          - MINIO_ROOT_PASSWORD
          - MINIO_SECRET_KEY
    composeEnvironment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    composeCommand:
      - server
      - /data
      - --console-address
      - :9001
    composeHealthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://127.0.0.1:9000/minio/health/live
      interval: 20s
      timeout: 5s
      retries: 10
      startPeriod: 20s
  qdrant:
    name: Qdrant
    image: 192.168.10.210/local-ai/qdrant/qdrant:v1.18.0
    port: 6333
    dataPath: /qdrant/storage
    envTemplate:
      QDRANT_API_KEY: __REPLACE_WITH_QDRANT_API_KEY__
    envSources:
      QDRANT_API_KEY:
        env: QDRANT_API_KEY
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - qdrant
          - qdrant-secret
        secretKeys:
          - QDRANT_API_KEY
          - QDRANT__SERVICE__API_KEY
    composeEnvironment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    composeHealthcheck:
      test:
        - CMD-SHELL
        - bash -lc '</dev/tcp/127.0.0.1/6333'
      interval: 20s
      timeout: 5s
      retries: 10
      startPeriod: 20s
  camunda:
    name: Camunda
    image: 192.168.10.210/local-ai/camunda/camunda:8.8.20
    port: 8080
    dataPath: /camunda
    envTemplate:
      CAMUNDA_ADMIN_USER: demo
      CAMUNDA_ADMIN_PASSWORD: __REPLACE_WITH_CAMUNDA_ADMIN_PASSWORD__
    envSources:
      CAMUNDA_ADMIN_PASSWORD:
        env: CAMUNDA_ADMIN_PASSWORD
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - camunda
          - camunda-secret
        secretKeys:
          - CAMUNDA_ADMIN_PASSWORD
          - CAMUNDA_CLIENT_SECRET
          - DEFAULT_THREE_ADMIN_PASSWORD
    composeEnvironment:
      CAMUNDA_ADMIN_USER: ${CAMUNDA_ADMIN_USER}
      CAMUNDA_ADMIN_PASSWORD: ${CAMUNDA_ADMIN_PASSWORD}
    composeHealthcheck:
      test:
        - CMD-SHELL
        - bash -lc '</dev/tcp/127.0.0.1/8080'
      interval: 20s
      timeout: 5s
      retries: 30
      startPeriod: 60s
  iotdb:
    name: IoTDB
    image: 192.168.10.210/local-ai/apache/iotdb:latest
    port: 6667
    dataPath: /iotdb/data
    envTemplate:
      IOTDB_USER: root
      IOTDB_PASSWORD: __REPLACE_WITH_IOTDB_PASSWORD__
    envSources:
      IOTDB_PASSWORD:
        env: IOTDB_PASSWORD
        secretNames:
          - local-ai-secrets
          - platform-runtime-secret
          - middleware-runtime-secret
          - iotdb
          - iotdb-secret
        secretKeys:
          - IOTDB_PASSWORD
          - EAM_IOTDB_PASSWORD
    composeEnvironment:
      IOTDB_USER: ${IOTDB_USER}
      IOTDB_PASSWORD: ${IOTDB_PASSWORD}
    composeHealthcheck:
      test:
        - CMD-SHELL
        - bash -lc '</dev/tcp/127.0.0.1/6667'
      interval: 20s
      timeout: 5s
      retries: 20
      startPeriod: 60s
  monitoring:
    name: Prometheus / Grafana
    image: 192.168.10.210/local-ai/prometheus:latest
    port: 9090
    dataPath: /prometheus
    composeHealthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9090/-/healthy
      interval: 20s
      timeout: 5s
      retries: 10
      startPeriod: 20s
