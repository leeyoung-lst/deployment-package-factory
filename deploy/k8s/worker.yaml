apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-package-factory-worker
  namespace: deployment-package-factory
  labels:
    app.kubernetes.io/name: deployment-package-factory
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-package-factory
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-package-factory
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: deployment-package-factory
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: deployment-package-factory-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: deployment-package-factory-config
            - secretRef:
                name: deployment-package-factory-secret
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deployment-package-factory-data
