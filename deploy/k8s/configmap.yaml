apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-package-factory-config
  namespace: deployment-package-factory
  labels:
    app.kubernetes.io/name: deployment-package-factory
data:
  DEPLOYMENT_PACKAGE_DATA_DIR: /app/data
  DEPLOYMENT_PACKAGE_OUTPUT_DIR: /app/data/deployment-packages
  DEPLOYMENT_PACKAGE_MAX_CONCURRENT_BUILDS: "1"
  DEPLOYMENT_PACKAGE_EXECUTION_MODE: worker
  DEPLOYMENT_PACKAGE_WORKER_POLL_INTERVAL_SECONDS: "3"
  DEPLOYMENT_PACKAGE_WORKER_HEARTBEAT_SECONDS: "15"
  DEPLOYMENT_PACKAGE_RUNNING_TASK_TIMEOUT_MINUTES: "120"
  DEPLOYMENT_PACKAGE_RETENTION_DAYS: "30"
  DEPLOYMENT_PACKAGE_MAX_TOTAL_GB: "500"
  DEPLOYMENT_PACKAGE_SOURCE_NAMESPACES_DEV: ""
  DEPLOYMENT_PACKAGE_SOURCE_NAMESPACES_TEST: ""
  DEPLOYMENT_PACKAGE_INSECURE_REGISTRIES: "192.168.10.210"
  DEPLOYMENT_PACKAGE_LOCAL_IMAGE_EXPORT: "true"
  DEPLOYMENT_PACKAGE_DATA_CLAIM: deployment-package-factory-data
