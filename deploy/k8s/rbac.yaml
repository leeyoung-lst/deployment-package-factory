apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployment-package-factory-runtime-image-reader
  labels:
    app.kubernetes.io/name: deployment-package-factory
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployment-package-factory-runtime-image-reader
  labels:
    app.kubernetes.io/name: deployment-package-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployment-package-factory-runtime-image-reader
subjects:
  - kind: ServiceAccount
    name: deployment-package-factory
    namespace: deployment-package-factory
