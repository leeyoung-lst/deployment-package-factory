apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-package-factory-frontend
  namespace: deployment-package-factory
  labels:
    app.kubernetes.io/name: deployment-package-factory
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deployment-package-factory
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-package-factory
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: deployment-package-factory-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DEPLOYMENT_PACKAGE_FRONTEND_API_BASE_URL
              value: ""
            - name: DEPLOYMENT_PACKAGE_FRONTEND_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: deployment-package-factory-secret
                  key: DEPLOYMENT_PACKAGE_FRONTEND_API_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-package-factory-frontend
  namespace: deployment-package-factory
  labels:
    app.kubernetes.io/name: deployment-package-factory
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: deployment-package-factory
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
